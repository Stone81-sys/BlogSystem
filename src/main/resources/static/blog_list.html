<script>
    var userUrl= "/user/getUserInfo?userId="+localStorage.getItem("loginUserId");

    getUserInfo(userUrl);

    getList();
    function getList(){

        $.ajax({
            type:"get",
            url:"/blog/getList",
            success:function(result){
                if(result!=null&&result.code==200){
                   let bloglist=result.data;
                   let finalList=" ";
                   for(const blogInfo of bloglist){
                    finalList+='<div class="blog">';
                    finalList+='<div class="title">'+blogInfo.title+'</div>';
                    finalList+='<div class="date">'+blogInfo.updateTime+'</div>';
                    finalList+='<div class="desc">'+blogInfo.content+'</div>';
                    finalList+='<a class="detail" href="blog_detail.html?id='+blogInfo.id+'">查看全文&gt;&gt;</a>';
                    finalList+='</div>';

                   }
                   $(".container .right").html(finalList);

                }
            }
        })

    }
    
</script>
